<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro Forum</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0f1115;
  color: #e6e6e6;
}

header {
  padding: 14px 18px;
  background: #151821;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #232634;
}

.container {
  max-width: 760px;
  margin: auto;
  padding: 20px;
}

.post {
  background: #171a22;
  border: 1px solid #232634;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 12px;
}

.post small {
  opacity: 0.6;
}

.panel {
  background: #171a22;
  border: 1px solid #232634;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 15px;
}

input, textarea {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #2a2f3d;
  background: #0f1115;
  color: white;
}

button {
  padding: 7px 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  margin-top: 8px;
  margin-right: 5px;
}

.primary { background: #5865f2; color: white; }
.danger { background: #e04848; color: white; }
.edit { background: #f6a200; color: black; }
.like { background: #2a2f3d; color: white; }

#search {
  width: 100%;
  margin-bottom: 15px;
}

/* IMAGE GRID */
.img-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
  margin-top: 10px;
}

.img-grid img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <div>
    <strong>💬 Retro Forum</strong><br>
    <small style="opacity:0.5">clean community feed</small>
  </div>
  <button id="loginBtn" class="like">Login</button>
</header>

<div class="container">

<div id="adminBox" class="panel" style="display:none;">
  <h3>👑 Admin Panel</h3>
  <textarea id="text" placeholder="Write post..."></textarea>
  <input id="image" placeholder="Image URLs (comma separated)">
  <button class="primary" onclick="createPost()">Post</button>
</div>

<input id="search" placeholder="🔎 Search posts..." oninput="loadPosts()">

<div id="posts"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlsIWQNJwjhofD07hyrEqSSJCI2uqfBvY",
  authDomain: "gaok-89901.firebaseapp.com",
  projectId: "gaok-89901",
  storageBucket: "gaok-89901.firebasestorage.app",
  messagingSenderId: "287365042202",
  appId: "1:287365042202:web:1c0dc4a94b37f395d981a3",
  measurementId: "G-4MD6JT6F2K"
};

const ADMIN_UID = "wOtvS062McPzHF5CpR1p9Loh4QW2";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const loginBtn = document.getElementById("loginBtn");
const adminBox = document.getElementById("adminBox");
const postsDiv = document.getElementById("posts");

loginBtn.onclick = async () => {
  if (auth.currentUser) {
    await signOut(auth);
  } else {
    const email = prompt("Email:");
    const pass = prompt("Password:");
    await signInWithEmailAndPassword(auth, email, pass);
  }
};

onAuthStateChanged(auth, (user) => {
  loginBtn.innerText = user ? "Logout" : "Login";

  if (user?.uid === ADMIN_UID) {
    adminBox.style.display = "block";
  } else {
    adminBox.style.display = "none";
  }
});

window.createPost = async () => {
  const user = auth.currentUser;
  if (!user || user.uid !== ADMIN_UID) return;

  const images = document.getElementById("image").value
    .split(",")
    .map(i => i.trim())
    .filter(i => i.length > 0);

  await addDoc(collection(db, "posts"), {
    text: document.getElementById("text").value,
    images: images,
    createdAt: Date.now(),
    likes: 0
  });

  loadPosts();
};

window.loadPosts = async () => {
  postsDiv.innerHTML = "";

  const search = document.getElementById("search").value.toLowerCase();

  const snap = await getDocs(collection(db, "posts"));

  snap.forEach(d => {
    const p = d.data();

    if (search && !p.text.toLowerCase().includes(search)) return;

    let imgHTML = "";

    if (p.images && p.images.length > 0) {
      imgHTML = `
        <div class="img-grid">
          ${p.images.map(img => `<img src="${img}">`).join("")}
        </div>
      `;
    }

    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <small>🕒 ${new Date(p.createdAt).toLocaleString()}</small>
      <p>${p.text}</p>

      ${imgHTML}

      <div>
        ❤️ ${p.likes || 0}

        <button class="like" onclick="likePost('${d.id}', ${p.likes || 0})">Like</button>

        ${auth.currentUser?.uid === ADMIN_UID ? `
          <button class="edit" onclick="editPost('${d.id}')">Edit</button>
          <button class="danger" onclick="deletePost('${d.id}')">Delete</button>
        ` : ""}
      </div>
    `;

    postsDiv.appendChild(div);
  });
};

window.likePost = async (id, likes) => {
  await updateDoc(doc(db, "posts", id), {
    likes: likes + 1
  });
  loadPosts();
};

window.deletePost = async (id) => {
  await deleteDoc(doc(db, "posts", id));
  loadPosts();
};

window.editPost = async (id) => {
  const newText = prompt("Edit post:");
  await updateDoc(doc(db, "posts", id), {
    text: newText
  });
  loadPosts();
};

loadPosts();
</script>

</body>
</html>
