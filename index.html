<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro Forum</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0f1115;
  color: #e6e6e6;
}

header {
  padding: 14px 18px;
  background: #151821;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #232634;
}

.container {
  max-width: 760px;
  margin: auto;
  padding: 20px;
}

.post {
  background: #171a22;
  border: 1px solid #232634;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 12px;
}

.panel {
  background: #171a22;
  border: 1px solid #232634;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 15px;
}

input, textarea, select {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #2a2f3d;
  background: #0f1115;
  color: white;
}

button {
  padding: 7px 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  margin-top: 8px;
  margin-right: 5px;
}

.primary { background: #5865f2; color: white; }
.danger { background: #e04848; color: white; }
.edit { background: #f6a200; color: black; }
.like { background: #2a2f3d; color: white; }

.img-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 8px;
  margin-top: 10px;
}

.img-grid img {
  width: 100%;
  height: 110px;
  object-fit: cover;
  border-radius: 10px;
  cursor: pointer;
}

.cat {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 8px;
  background: #2a2f3d;
  font-size: 12px;
  margin-left: 6px;
}
</style>
</head>

<body>

<header>
  <div>
    <strong>💬 Retro Forum</strong><br>
    <small style="opacity:0.5">clean community feed</small>
  </div>
  <button id="loginBtn" class="like">Login</button>
</header>

<div class="container">

<div id="adminBox" class="panel" style="display:none;">
  <h3>👑 Admin Panel</h3>

  <select id="category"></select>

  <textarea id="text" placeholder="Write post..."></textarea>
  <input id="image" placeholder="Image URLs (comma separated)">

  <button class="primary" onclick="createPost()">Post</button>

  <hr>

  <h4>Create Category</h4>
  <input id="newCat" placeholder="New category name">
  <button class="primary" onclick="createCategory()">Add Category</button>
</div>

<select id="filter" onchange="loadPosts()">
  <option value="">All</option>
</select>

<div id="posts"></div>

</div>

<!-- ZOOM -->
<div id="imgModal" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:9999;
">
  <span id="closeModal" style="
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    cursor:pointer;
    color:white;
  ">&times;</span>

  <img id="modalImg" style="max-width:90%; max-height:90%; border-radius:12px;">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  updateDoc,
  onSnapshot,
  query
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* FIREBASE (UNCHANGED) */
const firebaseConfig = {
  apiKey: "AIzaSyAlsIWQNJwjhofD07hyrEqSSJCI2uqfBvY",
  authDomain: "gaok-89901.firebaseapp.com",
  projectId: "gaok-89901",
  storageBucket: "gaok-89901.firebasestorage.app",
  messagingSenderId: "287365042202",
  appId: "1:287365042202:web:1c0dc4a94b37f395d981a3"
};

const ADMIN_UIDS = [
  "wOtvS062McPzHF5CpR1p9Loh4QW2",
  "IOIwUdImoHNDBnx5eAukHXirPPD2"
];

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let categories = [];

const catSelect = document.getElementById("category");
const filterSelect = document.getElementById("filter");

/* AUTH */
onAuthStateChanged(auth, (user) => {
  currentUser = user;

  document.getElementById("loginBtn").innerText = user ? "Logout" : "Login";

  document.getElementById("adminBox").style.display =
    user?.uid === ADMIN_UID ? "block" : "none";
});

/* LOGIN */
document.getElementById("loginBtn").onclick = async () => {
  if (auth.currentUser) {
    await signOut(auth);
  } else {
    const email = prompt("Email:");
    const pass = prompt("Password:");
    await signInWithEmailAndPassword(auth, email, pass);
  }
};

/* CATEGORIES */
onSnapshot(query(collection(db, "categories")), (snap) => {
  categories = snap.docs.map(d => d.data().name);

  catSelect.innerHTML = categories.map(c => `<option>${c}</option>`).join("");
  filterSelect.innerHTML =
    `<option value="">All</option>` +
    categories.map(c => `<option value="${c}">${c}</option>`).join("");
});

/* CREATE CATEGORY */
window.createCategory = async () => {
  if (currentUser?.uid !== ADMIN_UID) return;

  const val = document.getElementById("newCat").value.trim();
  if (!val) return;

  await addDoc(collection(db, "categories"), { name: val });
};

/* CREATE POST */
window.createPost = async () => {
  if (currentUser?.uid !== ADMIN_UID) return;

  const images = document.getElementById("image").value
    .split(",")
    .map(i => i.trim())
    .filter(Boolean);

  await addDoc(collection(db, "posts"), {
    text: document.getElementById("text").value,
    images,
    category: catSelect.value,
    createdAt: Date.now(),
    likes: 0
  });
};

/* 🔥 REAL-TIME POSTS (FIXED) */
const postsDiv = document.getElementById("posts");

onSnapshot(query(collection(db, "posts")), (snap) => {
  postsDiv.innerHTML = "";

  let posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  posts.sort((a, b) => b.createdAt - a.createdAt);

  posts.forEach(p => {
    const imgs = p.images || [];
    const isAdmin = currentUser?.uid === ADMIN_UID;

    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <small>${new Date(p.createdAt).toLocaleString()}
      <span class="cat">${p.category || "None"}</span></small>

      <p>${p.text}</p>

      ${imgs.length ? `
        <div class="img-grid">
          ${imgs.map(i => `<img src="${i}">`).join("")}
        </div>
      ` : ""}

      <div>
        ❤️ ${p.likes || 0}
        <button class="like" onclick="likePost('${p.id}', ${p.likes || 0})">Like</button>

        ${isAdmin ? `
          <button class="edit" onclick="editPost('${p.id}')">Edit</button>
          <button class="danger" onclick="deletePost('${p.id}')">Delete</button>
          <button class="primary" onclick="setCategory('${p.id}')">Set Category</button>
        ` : ""}
      </div>
    `;

    postsDiv.appendChild(div);
  });
});

/* ACTIONS */
window.likePost = async (id, likes) => {
  await updateDoc(doc(db, "posts", id), { likes: likes + 1 });
};

window.deletePost = async (id) => {
  await deleteDoc(doc(db, "posts", id));
};

window.editPost = async (id) => {
  const text = prompt("Edit:");
  if (!text) return;
  await updateDoc(doc(db, "posts", id), { text });
};

window.setCategory = async (id) => {
  const cat = prompt("Category:");
  if (!cat) return;
  await updateDoc(doc(db, "posts", id), { category: cat });
};

/* ZOOM FIX */
const modal = document.getElementById("imgModal");
const modalImg = document.getElementById("modalImg");

document.addEventListener("click", (e) => {
  if (e.target.tagName === "IMG" && e.target.closest(".img-grid")) {
    modal.style.display = "flex";
    modalImg.src = e.target.src;
  }
});

document.getElementById("closeModal").onclick = () => {
  modal.style.display = "none";
};

modal.onclick = (e) => {
  if (e.target === modal) modal.style.display = "none";
};
</script>

</body>
</html>
