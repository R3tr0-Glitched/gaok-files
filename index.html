<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro Forum</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div>
    <strong>💬 Retro Forum</strong><br>
    <small class="sub">clean community feed</small>
  </div>
  <button id="loginBtn">Login</button>
</header>

<div class="container">

<div id="adminBox" class="panel hidden">
  <h3>Admin Panel</h3>
  <textarea id="text" placeholder="Write post..."></textarea>
  <input id="image" placeholder="Image URL">
  <button id="postBtn">Post</button>
</div>

<input id="search" placeholder="Search..." />

<div id="posts"></div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
